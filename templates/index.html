<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Ghost - Deal Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            display: flex;
            justify-content: space-between;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .status-item {
            text-align: center;
        }
        .status-item strong {
            display: block;
            font-size: 24px;
            color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .section {
            margin-top: 30px;
        }
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .deal-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        .deal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .deal-card h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deal-price {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }
        .deal-meta {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            👻 Offer Ghost
        </h1>
        <p style="color: #666; margin-bottom: 20px;">Deal Tracker & Preisverlauf-Analyse</p>
        
        <div class="status" id="status">
            <div class="status-item">
                <strong id="productCount">-</strong>
                <span>Produkte</span>
            </div>
            <div class="status-item">
                <strong id="brandCount">-</strong>
                <span>Marken</span>
            </div>
            <div class="status-item">
                <strong id="dealsCount">-</strong>
                <span>Deals</span>
            </div>
        </div>
        
        <button class="btn" id="scanBtn" onclick="triggerScan()">
            🔄 Jetzt scannen
        </button>
        
        <div class="section">
            <h2>🔥 Top Deals</h2>
            <div class="deals-grid" id="dealsGrid">
                <div class="loading">Lade Deals... <div class="spinner"></div></div>
            </div>
        </div>
        
        <div class="section">
            <h2>⏰ Läuft bald ab</h2>
            <div class="deals-grid" id="expiringGrid">
                <div class="loading">Lade Angebote... <div class="spinner"></div></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        async function fetchStatus() {
            const res = await fetch(`${API_BASE}/status`);
            const data = await res.json();
            
            document.getElementById('productCount').textContent = data.products;
            document.getElementById('brandCount').textContent = data.brands;
        }
        
        async function fetchDeals() {
            const res = await fetch(`${API_BASE}/deals?limit=6`);
            const data = await res.json();
            
            const grid = document.getElementById('dealsGrid');
            
            if (data.deals.length === 0) {
                grid.innerHTML = '<div class="loading">Keine Deals gefunden (erste Ausführung?)</div>';
                return;
            }
            
            document.getElementById('dealsCount').textContent = data.deals.length;
            
            grid.innerHTML = data.deals.map(deal => `
                <div class="deal-card">
                    <h3>${deal.name}</h3>
                    <div class="deal-price">${deal.current_price.toFixed(2)}€/${deal.base_unit}</div>
                    <div class="deal-meta">
                        <span class="badge">${deal.store.toUpperCase()}</span>
                        <span class="badge">-${deal.savings_percent}%</span>
                        <br><br>
                        Durchschnitt: ${deal.avg_price.toFixed(2)}€/${deal.base_unit}
                    </div>
                </div>
            `).join('');
        }
        
        async function fetchExpiring() {
            const res = await fetch(`${API_BASE}/expiring?days=3`);
            const data = await res.json();
            
            const grid = document.getElementById('expiringGrid');
            
            if (data.expiring.length === 0) {
                grid.innerHTML = '<div class="loading">Keine ablaufenden Angebote</div>';
                return;
            }
            
            grid.innerHTML = data.expiring.slice(0, 6).map(item => {
                const date = item.valid_until.split('T')[0];
                const daysLeft = item.days_until_expiry;
                let expiryText = '';
                
                if (daysLeft === 0) expiryText = '⚠️ HEUTE';
                else if (daysLeft === 1) expiryText = '⚠️ MORGEN';
                else expiryText = `in ${daysLeft} Tagen`;
                
                return `
                    <div class="deal-card">
                        <h3>${item.name}</h3>
                        <div class="deal-price">${item.price.toFixed(2)}€</div>
                        <div class="deal-meta">
                            <span class="badge">${item.store.toUpperCase()}</span>
                            <span class="badge">${expiryText}</span>
                            <br><br>
                            Gültig bis: ${date}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function triggerScan() {
            const btn = document.getElementById('scanBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Scanne...';
            
            try {
                const res = await fetch(`${API_BASE}/scan`, { method: 'POST' });
                const data = await res.json();
                
                alert(`✅ Scan abgeschlossen!\n${data.deals_found} Deals gefunden`);
                
                // Reload data
                await loadAll();
            } catch (err) {
                alert('❌ Fehler beim Scannen: ' + err.message);
            }
            
            btn.disabled = false;
            btn.innerHTML = '🔄 Jetzt scannen';
        }
        
        async function loadAll() {
            await fetchStatus();
            await fetchDeals();
            await fetchExpiring();
        }
        
        // Initial load
        loadAll();
        
        // Auto-refresh every 5 minutes
        setInterval(loadAll, 300000);
    </script>
</body>
</html>

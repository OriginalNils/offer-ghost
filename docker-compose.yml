version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: offer-ghost-bot
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    networks:
      - offer-ghost-network

networks:
  offer-ghost-network:
    driver: bridge
